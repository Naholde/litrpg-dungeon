plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'litrpg-dungeon'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            // Быстрый вход: -Pquickplay=<мир> (одиночная) или -Pjoin=<адрес:порт> (сервер).
            if (project.hasProperty('quickplay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickplay').toString())
            }
            if (project.hasProperty('join')) {
                programArguments.addAll('--quickPlayMultiplayer', project.property('join').toString())
            }
            programArguments.addAll('--username', 'Dev')
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Запускает все автотесты GameTest и выходит; код выхода ≠ 0, если тест упал.
        gameTestServer {
            type = 'gameTestServer'
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'litrpg.dev', 'true'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Обычные тесты (JUnit) видят классы Minecraft и мода.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    // GeckoLib — анимированные модели хранителей и монстров.
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    // Curios — слоты украшений (кольца, амулет, оберег).
    maven { url = 'https://maven.theillusivec4.top/' }
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // gradlew test -Pregen — тесты-генераторы перепишут файлы данных (skills.json).
    systemProperty 'litrpg.root', projectDir.absolutePath
    if (project.hasProperty('regen')) systemProperty 'litrpg.regen', 'true'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
